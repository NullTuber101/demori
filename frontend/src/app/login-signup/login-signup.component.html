<div class="auth-container">
    <mat-card>
        <mat-card-title>{{ isLogin ? 'Login' : 'Signup' }}</mat-card-title>

        <form [formGroup]="isLogin ? loginForm : signupForm" (ngSubmit)="isLogin ? onLogin() : onSignup()">
            <div *ngIf="!isLogin">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Full Name</mat-label>
                    <input matInput formControlName="name" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email" />
                </mat-form-field>
            </div>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>BRID</mat-label>
                <input matInput formControlName="brid" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password" />
                <button mat-icon-button matSuffix (click)="showPassword = !showPassword" type="button"
                    aria-label="Toggle password visibility">
                    <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>

            <div *ngIf="!isLogin">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Confirm Password</mat-label>
                    <input matInput [type]="showConfirmPassword ? 'text' : 'password'"
                        formControlName="confirmPassword" />
                    <button mat-icon-button matSuffix (click)="showConfirmPassword = !showConfirmPassword" type="button"
                        aria-label="Toggle confirm password visibility">
                        <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </mat-form-field>
            </div>

            <button mat-raised-button color="primary" type="submit" class="submit-btn">
                {{ isLogin ? 'Login' : 'Signup' }}
            </button>
        </form>

        <button mat-button color="accent" (click)="toggleForm()" class="toggle-btn">
            {{ isLogin ? "Don't have an account? Signup" : "Already have an account? Login" }}
        </button>
    </mat-card>
</div>
