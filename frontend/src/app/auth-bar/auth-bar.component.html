<div class="top-bar">
    <ng-container *ngIf="isLoggedIn(); else loginBtn">
        <div class="user-info">
            <mat-icon>person</mat-icon>
            {{ getName() }}
        </div>
        <button mat-button color="warn" (click)="logout()">Logout</button>
    </ng-container>

    <ng-template #loginBtn>
        <button mat-button color="primary" routerLink="/login">Login</button>
    </ng-template>
</div>
